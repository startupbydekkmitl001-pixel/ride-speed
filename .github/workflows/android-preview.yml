name: Android standalone preview APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, 'codex/**']
    paths:
      - 'ExpoRideSpeed/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/android-preview.yml'
  pull_request:
    paths:
      - 'ExpoRideSpeed/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      build_preview: ${{ steps.preview.outputs.build_preview }}
      source_sha: ${{ steps.preview.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ExpoRideSpeed/package-lock.json
      - run: npm ci
        working-directory: ExpoRideSpeed
      - run: npm test && npm run typecheck && npm run lint
        working-directory: ExpoRideSpeed
      - run: npm ci && npm test
        working-directory: backend
      - run: node scripts/check-build-config.cjs && node scripts/check-android-preview-config.cjs
      - run: node --test scripts/test_native_libraries.cjs scripts/test_native_preview_gate.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash -n scripts/build-android-preview.sh && shellcheck scripts/build-android-preview.sh
      - name: Validate version and assign CI identity
        id: metadata
        run: node scripts/ci-metadata.cjs
      - name: Validate the explicit native preview request and source commit
        id: preview
        run: node scripts/native-preview-gate.cjs

  build:
    # Ordinary pushes/PRs verify. Native builds require manual dispatch, a version
    # tag, or [native-preview] on the codex/map-first-v5 push's exact head commit.
    if: needs.verify.outputs.build_preview == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: release
      IOS_BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      NATIVE_PREVIEW_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ExpoRideSpeed/package-lock.json
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate, compile and validate standalone Android preview
        run: bash scripts/build-android-preview.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-preview-debug-signed-${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.build_number }}
          path: build/android-preview/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save build diagnostics without private keys
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-preview-diagnostics-${{ needs.verify.outputs.build_number }}
          path: |
            build/android-preview/*.log
            build/android-preview/app-identity.json
            build/android-preview/build-info.json
            build/android-preview/generated-project.json
            build/android-preview/native-library-preparation.json
            build/android-preview/validation.json
          if-no-files-found: warn
          retention-days: 3
